<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0" />
    <title>お問い合わせ</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  </head>
  <body>
    <aside class="sidebar">
      <header class="sidebar-header">
        <a href="index.html" class="brand">Profile</a>
        <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="primary-nav" aria-label="メニューを開閉する">
          <span class="nav-toggle-bar"></span>
          <span class="nav-toggle-bar"></span>
          <span class="nav-toggle-bar"></span>
        </button>
      </header>
      <nav class="sidebar-nav" id="primary-nav" aria-label="サイト内ナビゲーション">
        <a href="index.html">Home</a>
        <a href="about.html">About</a>
        <a href="baseball.html">Baseball</a>
        <a href="favorites.html">Favorites</a>
        <a href="contact.html">Contact</a>
      </nav>
    </aside>

    <main class="content" id="main-content">
      <section>
        <div class="page-header">
          <span class="eyebrow">Contact</span>
          <h2>お問い合わせ</h2>
        </div>
        <p>感想や質問など、気軽にメッセージを送ってください。</p>

        <form class="contact-form" novalidate>
          <div>
            <label for="contact-name">お名前</label>
            <input type="text" id="contact-name" name="name" placeholder="山田 太郎" required>
          </div>
          <div>
            <label for="contact-email">メールアドレス</label>
            <input type="email" id="contact-email" name="email" placeholder="example@example.com" required>
          </div>
          <div>
            <label for="contact-message">メッセージ</label>
            <textarea id="contact-message" name="message" placeholder="お気軽にメッセージをどうぞ" required></textarea>
          </div>
          <button type="submit">送信する</button>
        </form>
        <p class="form-success" role="status"></p>
      </section>

      <footer class="site-footer">
        <div class="copyright">© <span class="js-year">2026</span>
      </footer>
    </main>

    <script src="Main.js" defer></script>
  </body>
</html>
